<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support - Fayaz Bin Salam</title>
<meta name="description" content="If you like my works and want to support me, feel free to support. Thank you!">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --chip:#f3f4f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --card:#131a24; --text:#e5e7eb; --muted:#9ca3af; --line:#243041; --chip:#1b2431; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px 28px; text-align:center; }
  .heart { width:56px; height:56px; margin:0 auto 14px; border-radius:16px; display:grid; place-items:center;
    background:linear-gradient(135deg,#f59e0b,#ea580c); color:#fff; }
  h1 { font-size:26px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.55; margin:0 0 22px; }
  .opts { display:grid; gap:10px; text-align:left; }
  .btn { display:flex; align-items:center; gap:14px; padding:15px 16px; border-radius:14px; border:1px solid var(--line);
    background:var(--chip); color:var(--text); text-decoration:none; }
  .btn:hover { border-color:var(--muted); }
  .btn:focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
  .ico { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; color:#111; }
  .ico svg { width:22px; height:22px; }
  .t { font-weight:700; font-size:16px; display:block; }
  .s { font-size:14px; color:var(--muted); }
  .thanks { margin:22px 0 0; font-size:15px; }
  footer { margin-top:18px; font-size:14px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="heart"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.9-9.4-9.3C1.2 8.4 3.4 5 6.8 5c2 0 3.7 1 5.2 2.9C13.5 6 15.2 5 17.2 5c3.4 0 5.6 3.4 4.2 6.7C19.5 16.1 12 21 12 21z"/></svg></div>
  <h1>Support my work</h1>
  <p>If you like my works and want to support me, feel free to support. It helps me keep building and sharing free apps and tools.</p>
  <div class="opts">
    <a class="btn" href="https://www.buymeacoffee.com/p32929" target="_blank" rel="noopener">
      <span class="ico" style="background:#ffdd00"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v5a6 6 0 0 1-6 6h0a6 6 0 0 1-6-6V8zM17 9h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M11 3v2M14 3v2"/></svg></span>
      <span><span class="t">Buy me a coffee</span><span class="s">Quick one-time support with a card</span></span>
    </a>
    <a class="btn" href="https://p32929.github.io/SendMoney2MeV1/" target="_blank" rel="noopener">
      <span class="ico" style="background:#a7f3d0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M6.5 15h3"/></svg></span>
      <span><span class="t">My payment details</span><span class="s">Other ways to send support</span></span>
    </a>
  </div>
  <p class="thanks">Thank you!</p>
  <footer><a href="https://p32929.github.io/">Back to my projects</a></footer>
</main>
</body>
</html>
