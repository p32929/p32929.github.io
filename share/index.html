<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share - Fayaz Bin Salam</title>
<meta name="description" content="Share this project with your friends in just a click.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --page:#ffffff; --panel:#fafaf9; --bar:#f3f2f1; --line:#e7e5e4; --dot:#d6d3d1; --text:#1c1917; --muted:#78716c; --accent:#1d4ed8; --hover:#f0efed; --on:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --page:#0d1117; --panel:#161b22; --bar:#1c2128; --line:#30363d; --dot:#484f58; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --hover:#1f252d; --on:#0d1117; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--page); color:var(--text); font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
  .win { width:100%; max-width:600px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .bar { position:relative; height:33px; background:var(--bar); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:500; color:var(--muted); }
  .dots { position:absolute; left:13px; top:12px; display:flex; gap:6px; }
  .dots i { width:10px; height:10px; border-radius:50%; background:var(--dot); }
  .body { padding:22px 26px 24px; }
  .cmd { margin:0; font-weight:500; overflow-wrap:anywhere; }
  .cmd b, .p { color:var(--accent); font-weight:700; }
  h1 { font-size:28px; line-height:1.2; margin:14px 0 6px; word-break:break-word; }
  .desc { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .label { color:var(--muted); font-size:13px; margin:0 0 8px; }
  .menu { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .opt { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); color:var(--text); font:inherit; font-size:14px; text-decoration:none; cursor:pointer; text-align:left; }
  .opt:hover { background:var(--hover); border-color:var(--muted); }
  .opt:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .opt kbd { font:inherit; font-size:12px; font-weight:700; color:var(--accent); border:1px solid var(--line); border-radius:5px; padding:1px 6px; flex:none; }
  .opt span { flex:1; }
  .opt .go { flex:none; color:var(--muted); }
  .wide { grid-column:1 / -1; background:var(--accent); border-color:var(--accent); color:var(--on); font-weight:700; }
  .wide:hover { background:var(--accent); opacity:.92; }
  .wide kbd { color:var(--on); border-color:currentColor; opacity:.85; }
  .wide .go { color:var(--on); }
  .foot { margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); display:flex; gap:18px; flex-wrap:wrap; font-size:13px; }
  .foot a { color:var(--muted); text-decoration:none; }
  .foot a:hover { color:var(--accent); }
  .hint { color:var(--muted); font-size:12px; margin:14px 0 0; }
  @media (max-width:480px) { .body { padding:18px 16px 20px; } .opt { padding:10px; gap:8px; } .opt .go { display:none; } h1 { font-size:24px; } .hint { display:none; } }
</style>
</head>
<body>
<main class="win">
  <div class="bar"><div class="dots"><i></i><i></i><i></i></div><span id="tab">~/share</span></div>
  <div class="body">
    <p class="cmd"><b>$</b> share <span id="target">p32929.github.io</span></p>
    <h1 id="name">Fayaz Bin Salam</h1>
    <p class="desc" id="desc">Apps, tools and libraries by Fayaz Bin Salam.</p>

    <p class="label"># pick where to share it</p>
    <div class="menu">
      <button class="opt wide" id="native" hidden><kbd>s</kbd><span>share with an app on this device</span><span class="go">→</span></button>
      <a class="opt" data-net="facebook" data-key="f" target="_blank" rel="noopener"><kbd>f</kbd><span>facebook</span><span class="go">→</span></a>
      <a class="opt" data-net="x" data-key="x" target="_blank" rel="noopener"><kbd>x</kbd><span>x (twitter)</span><span class="go">→</span></a>
      <a class="opt" data-net="linkedin" data-key="l" target="_blank" rel="noopener"><kbd>l</kbd><span>linkedin</span><span class="go">→</span></a>
      <a class="opt" data-net="whatsapp" data-key="w" target="_blank" rel="noopener"><kbd>w</kbd><span>whatsapp</span><span class="go">→</span></a>
      <a class="opt" data-net="telegram" data-key="t" target="_blank" rel="noopener"><kbd>t</kbd><span>telegram</span><span class="go">→</span></a>
      <a class="opt" data-net="reddit" data-key="r" target="_blank" rel="noopener"><kbd>r</kbd><span>reddit</span><span class="go">→</span></a>
      <a class="opt" data-net="email" data-key="e"><kbd>e</kbd><span>email</span><span class="go">→</span></a>
      <button class="opt" id="copy" data-key="c"><kbd>c</kbd><span id="copyText">copy link</span><span class="go">⧉</span></button>
    </div>
    <p class="hint">tip: press a key to pick an option</p>

    <div class="foot">
      <a id="back" href="https://p32929.github.io/">$ open project</a>
      <a href="https://p32929.github.io/support/">$ support</a>
      <a href="https://p32929.github.io/">$ more projects</a>
    </div>
  </div>
</main>
<script>
  // Only a plain repo name is accepted; anything else shares the portfolio.
  var repo = new URLSearchParams(location.search).get("repo") || "";
  var ok = /^[A-Za-z0-9._-]{1,100}$/.test(repo) && repo !== "." && repo !== "..";
  var url = ok ? "https://github.com/p32929/" + repo : "https://p32929.github.io/";
  var title = ok ? repo : "Fayaz Bin Salam";
  var text = ok ? "Check out " + repo + " on GitHub" : "Check out the apps and tools by Fayaz Bin Salam";

  function show() {
    document.getElementById("name").textContent = title;
    document.getElementById("target").textContent = url.replace(/^https:\/\//, "").replace(/\/$/, "");
    document.getElementById("tab").textContent = ok ? "~/share/" + repo : "~/share";
    var back = document.getElementById("back"); back.href = url; back.textContent = ok ? "$ open project" : "$ open portfolio";
    document.title = "Share " + title;
    var e = encodeURIComponent, links = {
      facebook: "https://www.facebook.com/sharer/sharer.php?u=" + e(url),
      x: "https://twitter.com/intent/tweet?url=" + e(url) + "&text=" + e(text),
      linkedin: "https://www.linkedin.com/sharing/share-offsite/?url=" + e(url),
      whatsapp: "https://api.whatsapp.com/send?text=" + e(text + " " + url),
      telegram: "https://t.me/share/url?url=" + e(url) + "&text=" + e(text),
      reddit: "https://www.reddit.com/submit?url=" + e(url) + "&title=" + e(text),
      email: "mailto:?subject=" + e(text) + "&body=" + e(url)
    };
    document.querySelectorAll("[data-net]").forEach(function (a) { a.href = links[a.dataset.net]; });
  }
  show();

  if (ok) {
    document.getElementById("desc").textContent = "A project by Fayaz Bin Salam.";
    fetch("https://api.github.com/repos/p32929/" + encodeURIComponent(repo))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || d.private) return;
        if (d.description) { document.getElementById("desc").textContent = d.description; text = "Check out " + d.name + ": " + d.description; }
        if (d.name) title = d.name;
        show();
      })
      .catch(function () {});
  }

  var nativeBtn = document.getElementById("native");
  if (navigator.share) {
    nativeBtn.hidden = false;
    nativeBtn.dataset.key = "s";
    nativeBtn.onclick = function () { navigator.share({ title: title, text: text, url: url }).catch(function () {}); };
  }
  document.getElementById("copy").onclick = function () {
    var t = document.getElementById("copyText");
    var done = function () { t.textContent = "copied!"; setTimeout(function () { t.textContent = "copy link"; }, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt("Copy this link", url); });
    else prompt("Copy this link", url);
  };

  // Keyboard shortcuts: the letter shown next to each option.
  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var el = document.querySelector('[data-key="' + ev.key.toLowerCase() + '"]:not([hidden])');
    if (el) { ev.preventDefault(); el.click(); }
  });
</script>
</body>
</html>
